name: Backfill fund NAV history

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Optional maximum number of schemes to fetch
        required: false
        type: string
      codes:
        description: Optional comma-separated scheme codes
        required: false
        type: string

concurrency:
  group: fund-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAV_STORE: supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET || 'fund-nav' }}
      RISK_FREE_RATE: ${{ vars.RISK_FREE_RATE || '0.065' }}
      ARGS: ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
      CODES: ${{ inputs.codes && format('--codes {0}', inputs.codes) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org/
      - run: npm run db:migrate
      # GitHub kills jobs at 6h. Stop starting new schemes after 4h so the
      # benchmark and precompute steps always run; re-dispatch (or let the
      # nightly job) finish whatever is left - progress is persisted.
      - run: npm run backfill -- --max-minutes 240 --concurrency 12 $ARGS $CODES
      - run: npm run benchmarks
      - run: npm run precompute

